# Builds the works that can run as a static site and publishes them to GitHub Pages:
#   https://will1202.github.io/AIDIY/break-the-screen/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mixed-reality/break-the-screen/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mixed-reality/break-the-screen/package-lock.json

      - name: Test and build BREAK THE SCREEN
        working-directory: mixed-reality/break-the-screen
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site/break-the-screen
          cp -r mixed-reality/break-the-screen/dist/. _site/break-the-screen/
          cp .github/pages/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}break-the-screen/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
