# Builds every work as a static site and publishes them to GitHub Pages:
#   https://will1202.github.io/AIDIY/          index of all works (.github/pages/index.html)
#   https://will1202.github.io/AIDIY/<work>/   one folder per work, built from <category>/<work>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'space/**'
      - 'audio-visual/**'
      - 'games/**'
      - 'mixed-reality/**'
      - '.github/pages/**'
      - '.github/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/*/package-lock.json'

      - name: Test and build every work
        run: |
          set -e
          for dir in space/event-horizon space/god-mode audio-visual/liquid-frequency games/portal-paradox mixed-reality/break-the-screen; do
            echo "::group::$dir"
            (cd "$dir" && npm ci && npm test --if-present && npm run build)
            mkdir -p "_site/$(basename "$dir")"
            cp -r "$dir/dist/." "_site/$(basename "$dir")/"
            echo "::endgroup::"
          done

      - name: Add the index page
        run: |
          cp .github/pages/index.html _site/index.html
          mkdir -p _site/assets
          cp .github/assets/banner.jpg .github/assets/cover-*.jpg _site/assets/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
